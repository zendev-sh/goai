<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GoAI - AI SDK for Go</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1e293b; border-radius: 16px; padding: 48px; max-width: 520px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,.5); }
    .logo { font-size: 48px; font-weight: 800; background: linear-gradient(135deg, #60a5fa, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    .desc { color: #cbd5e1; line-height: 1.7; margin-bottom: 32px; }
    .badge { display: inline-block; background: #334155; color: #93c5fd; padding: 6px 16px; border-radius: 999px; font-size: 13px; font-weight: 600; margin-bottom: 24px; }
    .stats { display: flex; justify-content: center; gap: 32px; }
    .stat { text-align: center; }
    .stat-num { font-size: 28px; font-weight: 700; color: #60a5fa; }
    .stat-label { font-size: 12px; color: #64748b; text-transform: uppercase; letter-spacing: .5px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">GoAI</div>
    <div class="badge">24+ LLM Providers</div>
    <p class="desc">One API across every major LLM provider — OpenAI, Anthropic, Google, AWS Bedrock, Azure, and more. Built for Go, inspired by Vercel AI SDK.</p>
    <div class="stats">
      <div class="stat"><div class="stat-num">24+</div><div class="stat-label">Providers</div></div>
      <div class="stat"><div class="stat-num">90%</div><div class="stat-label">Coverage</div></div>
      <div class="stat"><div class="stat-num">0</div><div class="stat-label">Deps</div></div>
    </div>
  </div>
</body>
</html>
